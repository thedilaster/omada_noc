services:
  postgres:
    image: postgres:16-alpine
    container_name: noc_dash_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: noc_password
      POSTGRES_DB: noc_dash
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noc_dash"]
      interval: 5s
      timeout: 5s
      retries: 5

  noc_dash:
    build:
      context: .
      dockerfile: Containerfile
    container_name: noc_dash
    image: noc_dash:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://postgres:noc_password@postgres:5432/noc_dash
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
